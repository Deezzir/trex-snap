name: trex-generator
base: core22
version: "3.08"
license: Apache-2.0
summary: Cisco TRex realistic traffic generator
grade: stable
confinement: strict
icon: snap/gui/icon.png
issues: https://github.com/Deezzir/trex-snap/issues
source-code: https://github.com/Deezzir/trex-snap
description: |
  TRex is an open source, low cost, stateful and stateless traffic generator
  fuelled by DPDK. This snap packages the TRex server, console and Python
  automation client from the upstream trex-core source.

  The server runs in af_packet mode on kernel interfaces, without hugepages
  or NIC driver binding. DPDK PCI mode is not supported under strict
  confinement.

  **Setup**

      sudo snap connect trex-generator:network-control
      sudo snap connect trex-generator:hardware-observe
      sudo snap connect trex-generator:process-control
      sudo snap connect trex-generator:system-observe

  **Configuration**

  Configuration files, scripts and their output live in
  /var/snap/trex-generator/common. Select the server configuration with
  `sudo snap set trex-generator config=<path relative to that directory>`
  (default `trex_cfg.yaml`), or pass `--cfg <absolute path>`.

  **Commands**

  - `trex-generator.t-rex-64`: TRex server
  - `trex-generator.console`: interactive console
  - `trex-generator.python`: Python with the TRex automation client

  Upstream: https://github.com/cisco-system-traffic-generator/trex-core
architectures:
  - build-on: amd64

apps:
  t-rex-64:
    command: bin/trex-server
    plugs:
      - network
      - network-bind
      - network-control
      - hardware-observe
      - system-observe
      - process-control
  console:
    command: bin/trex-python $SNAP/opt/trex/trex-console
    plugs:
      - network
  python:
    command: bin/trex-python
    plugs:
      - network
      - network-bind

parts:
  trex:
    plugin: nil
    source: https://github.com/cisco-system-traffic-generator/trex-core.git
    source-type: git
    # v3.08 is untagged upstream; this is the "v3.0.8" release commit.
    source-commit: e2777369716b9a8872ada0d1ddeab6e8164d19ce
    build-packages:
      - build-essential
      - zlib1g-dev
      - libnuma-dev
      - python3
      - pkg-config
    stage-packages:
      - pciutils
    override-build: |
      cd linux_dpdk
      ./b configure --no-mlx=all
      ./b build -j"${CRAFT_PARALLEL_BUILD_COUNT}" --no-old
      cd ..
      dest="${CRAFT_PART_INSTALL}/opt/trex"
      mkdir -p "${dest}"
      # Drop links to optional components that were not built (e.g. BIRD).
      find scripts -xtype l -delete
      cp -rL scripts/. "${dest}/"
      rm -rf "${dest}"/*-debug* "${dest}"/so/ppc64le "${dest}"/so/arm
      find "${dest}" -name "__pycache__" -prune -exec rm -rf {} +
      strip "${dest}/_t-rex-64" "${dest}"/so/x86_64/*.so* || true
      git rev-parse HEAD > "${dest}/SOURCE_COMMIT"
  wrappers:
    plugin: dump
    source: wrappers
    organize:
      "*": bin/
